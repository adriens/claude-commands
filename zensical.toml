[project]
site_name = "Didi's Claude Code Skills"
site_description = "Collection de slash commands (skills) pour Claude Code."
site_author = "adriens"
site_url = "https://adriens.github.io/claude-commands/"
repo_url = "https://github.com/adriens/claude-commands"
repo_name = "adriens/claude-commands"
copyright = "Copyright &copy; 2026 adriens — v1.8.0"

# Navigation explicite pour éviter les doublons
nav = [
    { "Accueil" = "index.md" },
    { "Skills" = [
        { "Recherche AVPs OPT-NC" = "skills/opt-nc-avps/index.md" },
        { "Candidature JSON Resume" = "skills/json-resume/index.md" },
        { "Menus Aquavena" = "skills/aquavena/index.md" },
        { "Eaux de Baignade Nouméa" = "skills/edb-noumea/index.md" },
        { "Kalolo — Expressions caldoches" = "skills/kalolo/index.md" },
        { "EAE — Entretien Annuel d'Évaluation" = "skills/template-eae/index.md" },
        { "Rill — Analyse de données" = "skills/rill/index.md" },
        { "📶 Helia NC" = [
            { "Consommation" = "skills/helia-conso/index.md" },
            { "Réseau" = "skills/helia-reseau/index.md" }
        ]}
    ]}
]

[project.theme]
language = "fr"
features = [
    "navigation.footer",
"navigation.path",
    "navigation.top",
    "navigation.tracking",
    "content.code.copy",
    "content.tooltips",
    "search.highlight"
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/rastadidi"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/adriens"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/adrien-sales/"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://www.youtube.com/@devopslabs2812"

[[project.extra.social]]
icon = "lucide/smile"
link = "https://huggingface.co/rastadidi"

[[project.extra.social]]
icon = "fontawesome/brands/kaggle"
link = "https://www.kaggle.com/adriensales"
