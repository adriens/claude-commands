[project]
site_name = "Claude Code Skills"
site_description = "Collection de slash commands (skills) pour Claude Code."
site_author = "adriens"
site_url = "https://adriens.github.io/claude-commands/"
copyright = "Copyright &copy; 2026 adriens"

[project.theme]
language = "fr"
features = [
    "navigation.footer",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "content.code.copy",
    "content.tooltips",
    "search.highlight"
]

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/x-twitter"
link = "https://x.com/rastadidi"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/adriens"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/adrien-sales/"

[[project.extra.social]]
icon = "fontawesome/brands/youtube"
link = "https://www.youtube.com/@devopslabs2812"

[[project.extra.social]]
icon = "lucide/database"
link = "https://huggingface.co/rastadidi"
